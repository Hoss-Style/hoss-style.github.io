<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hossa.dev</title>
  <meta name="description" content="Projects and experiments." />
  <style>
    :root {
      --bg: #fafaf8;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --card-bg: #ffffff;
      --card-border: #e8e8e4;
      --accent: #4361ee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --text: #ececec;
        --muted: #9a9a9a;
        --card-bg: #1c1c1c;
        --card-border: #2c2c2c;
        --accent: #7b96ff;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main { max-width: 560px; width: 100%; }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .tagline {
      color: var(--muted);
      margin-top: 6px;
      font-size: 1rem;
    }
    .projects {
      margin-top: 36px;
      display: grid;
      gap: 14px;
    }
    .project {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 18px 20px;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }
    .project:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .project-name {
      font-weight: 600;
      font-size: 1.05rem;
    }
    .project-desc {
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: 4px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <h1>hossa.dev</h1>
    <p class="tagline">Projects &amp; experiments.</p>

    <div class="projects">
      <a class="project" href="https://flashcards.hossa.dev">
        <div class="project-name">🌈 Rainbow Words</div>
        <div class="project-desc">Sight-word flashcards for early readers — kindergarten rainbow words and 1st-grade cycle words, with read-aloud audio.</div>
      </a>
    </div>

  </main>
</body>
</html>
